    <!-- Share card. ABSOLUTE URLs, unlike everything else on this page: Vite's base is "./" so
         the build works at any Pages subpath, but Open Graph does not accept a relative URL, and
         Discord's crawler runs no JavaScript and ignores the fragment. Without these four tags a
         pasted link unfurls as a line of text. They were absent until 2026-08-01, and the
         omission was invisible from inside the app, because nothing links to a share card.
         tools/share-card-gate.mjs now fails on it. If the deployment URL changes, edit here. -->
    <meta property="og:title" content="Misfits Database" />
    <meta property="og:description" content="A multi-faction Fallout-style terminal viewer for SS14 roleplay factions: Pip-Boy dossiers, lore, and roleplay guides." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Misfits Database" />
    <meta property="og:url" content="https://dr-orac.github.io/oracular-db/" />
    <meta property="og:image" content="https://dr-orac.github.io/oracular-db/og-card.png?v=2" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dr-orac.github.io/oracular-db/og-card.png?v=2" />

    <!-- THE COLOUR MODE, BEFORE THE FIRST STYLESHEET. The mode is a fixed layer over the whole
         page, so a frame painted in the wrong one is a flash of somebody else's screen. This is
         synchronous and tiny, exactly as INTERFACE's adopting guide asks, and the two vendored
         sheets are linked after it.

         BOTH VALUES ARE INJECTED, neither typed here: `full` is the Manifest's
         `defaults.colorMode`, so where a reader starts stays the Pack's to say, and
         `mdb-settings` is the one storage key lib/stored-settings.ts names. Both are set on the
         environment by vite.config.ts, which is where the Manifest is read; the comment there says
         why this is Vite's own env substitution and not a plugin. -->
    <script>
      (function () {
        var mode = "full";
        // localStorage throws under file:// in some webviews, and a reader who has chosen nothing
        // is the same case as a reader whose browser will not say: the Manifest's default.
        try {
          var chosen = JSON.parse(localStorage.getItem("mdb-settings") || "{}").colorMode;
          if (chosen) mode = chosen;
        } catch (e) {}
        document.documentElement.setAttribute("data-color-mode", mode);
      })();
    </script>
